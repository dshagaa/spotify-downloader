[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-dl"
version = "1.4.0"
description = "Downloads Spotify playlists in high quality without login"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mutagen>=1.47.0",
    "pymongo>=4.16.0",
    "redis>=7.3.0",
    "spotapi>=1.2.7",
    "tls-client>=1.0.1",
    "websockets>=16.0",
    "yt-dlp>=2026.3.17",
    "ytmusicapi>=1.11.5",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30.0",
]

[tool.setuptools]
py-modules = ["core"]
packages = ["web"]

[tool.setuptools.package-data]
web = ["templates/*.html", "static/*"]

[project.urls]
Source = "https://github.com/invzfnc/spotify-downloader"
Guide = "https://youtu.be/xHsE06ov59A"

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
]

